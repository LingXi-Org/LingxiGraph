name: Documentation

on:
  push:
    branches:
      - main
    paths:
      - 'Wiki/**'
      - 'docs/**'
      - 'README.md'
      - 'README.en.md'
      - 'CHANGELOG.md'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'Wiki/**'
      - 'docs/**'
      - 'README.md'
      - 'README.en.md'
      - 'CHANGELOG.md'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: Wiki
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: Wiki/.nvmrc
          cache: npm
          cache-dependency-path: Wiki/package-lock.json

      - name: Install dependencies
        run: npm ci --registry=https://registry.npmjs.org

      - name: Check, typecheck, and build
        run: npm run check

      - name: Upload static site
        uses: actions/upload-artifact@v6
        with:
          name: lingxigraph-docs
          path: Wiki/out
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy to Cloudflare Pages
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Download static site
        uses: actions/download-artifact@v7
        with:
          name: lingxigraph-docs
          path: Wiki/out

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          command: pages deploy Wiki/out --project-name=lingxigraph-docs
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
