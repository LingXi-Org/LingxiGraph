name: Publish Python package

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Annotated release tag to publish
        required: true
        default: v2.2.0
        type: string
      repository:
        description: Package index
        required: true
        default: testpypi
        type: choice
        options:
          - testpypi
          - pypi

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Validate tag input
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a tag such as v2.1.0, got: $RELEASE_TAG" >&2
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: Verify annotated tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          test "$(git describe --tags --exact-match)" = "$RELEASE_TAG"
          test "$(git cat-file -t "$RELEASE_TAG")" = tag

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build distributions
        run: |
          python -m pip install --disable-pip-version-check build
          python -m build

      - name: Verify distribution metadata
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          python - <<'PY'
          import email
          import os
          import pathlib
          import zipfile

          expected = os.environ["RELEASE_TAG"].removeprefix("v")
          wheels = list(pathlib.Path("dist").glob("lingxigraph-*.whl"))
          sdists = list(pathlib.Path("dist").glob("lingxigraph-*.tar.gz"))
          assert len(wheels) == len(sdists) == 1, (wheels, sdists)
          with zipfile.ZipFile(wheels[0]) as archive:
              metadata_path = next(
                  name for name in archive.namelist() if name.endswith(".dist-info/METADATA")
              )
              metadata = email.message_from_bytes(archive.read(metadata_path))
          assert metadata["Name"] == "lingxigraph"
          assert metadata["Version"] == expected
          requirements = metadata.get_all("Requires-Dist") or []
          assert all("extra ==" in requirement for requirement in requirements), requirements
          assert expected in wheels[0].name and expected in sdists[0].name
          PY

      - name: Publish to TestPyPI
        if: inputs.repository == 'testpypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

      - name: Publish to PyPI
        if: inputs.repository == 'pypi'
        uses: pypa/gh-action-pypi-publish@release/v1
