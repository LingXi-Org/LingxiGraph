name: Refresh release adapter lockfile

on:
  push:
    branches:
      - release/v2.3.0
    paths:
      - '.github/workflows/release-lock-refresh.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release branch
        uses: actions/checkout@v6
        with:
          ref: release/v2.3.0
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Regenerate Chainlit adapter lockfile
        working-directory: adapters/chainlit
        run: uv lock

      - name: Commit lockfile if changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- adapters/chainlit/uv.lock; then
            echo 'adapter uv.lock already current'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add adapters/chainlit/uv.lock
          git commit -m 'release: refresh Chainlit adapter lock for 2.3.0'
          git push origin HEAD:release/v2.3.0
