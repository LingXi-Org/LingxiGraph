name: Probe v2.3.0 release status

on:
  push:
    branches:
      - release/v2.3.0
    paths:
      - '.github/workflows/release-status-probe.yml'

permissions:
  contents: write
  actions: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: release/v2.3.0
      - name: Wait for release workflow and capture status
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            gh run list --repo LingXi-Org/LingxiGraph --workflow publish.yml --branch main --limit 5 \
              --json databaseId,status,conclusion,event,headSha,displayTitle,createdAt > .release-status.json
            if python - <<'PY'
          import json
          data=json.load(open('.release-status.json'))
          target=[r for r in data if r.get('headSha')=='4d816bb6ab57a8d109a39b8322597d6f01043055']
          raise SystemExit(0 if target and target[0].get('status')=='completed' else 1)
          PY
            then
              break
            fi
            sleep 5
          done
          cat .release-status.json
      - name: Commit probe result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .release-status.json
          git commit -m 'ci: record v2.3.0 release workflow status'
          git push origin HEAD:release/v2.3.0
