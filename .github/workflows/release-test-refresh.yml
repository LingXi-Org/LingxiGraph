name: Align release version contract test

on:
  push:
    branches:
      - release/v2.3.0
    paths:
      - '.github/workflows/release-test-refresh.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release branch
        uses: actions/checkout@v6
        with:
          ref: release/v2.3.0
          fetch-depth: 0

      - name: Remove hard-coded release version from test
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/test_agent_server.py')
          text = path.read_text()
          old_import = 'from lingxigraph import END, START, StateGraph, interrupt\n'
          new_import = 'from lingxigraph import END, START, StateGraph, __version__, interrupt\n'
          old_assert = 'self.assertEqual(initialized.json()["result"]["serverInfo"]["version"], "2.2.0")'
          new_assert = 'self.assertEqual(initialized.json()["result"]["serverInfo"]["version"], __version__)'
          if old_import not in text or old_assert not in text:
              raise SystemExit('expected version contract test pattern not found')
          path.write_text(text.replace(old_import, new_import, 1).replace(old_assert, new_assert, 1))
          PY

      - name: Commit test update
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/test_agent_server.py
          git commit -m 'test: derive MCP server version from package metadata'
          git push origin HEAD:release/v2.3.0
